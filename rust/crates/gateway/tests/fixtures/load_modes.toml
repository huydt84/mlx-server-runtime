schema_version = 2

[sampling]
seed = 7
temperature = 0.0
top_p = 1.0
request_timeout_seconds = 30
readiness_timeout_seconds = 30

[calibration]
max_cv_percent = 5.0

[prompts.short]
kind = "short"
count = 8
target_tokens = 16

[models.primary]
checkpoint = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

[runtime_configurations.serial]
backend = "v1"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "0" }

[workloads.sequential_stream]
prompt_group = "short"
output_tokens = 4
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 2
cache_state = "cold"
primary_metric = "ttft"

[workloads.burst_nonstream]
prompt_group = "short"
output_tokens = 4
streaming = false
load_mode = "burst"
concurrency = 3
requests_per_trial = 3
cache_state = "cold"
primary_metric = "end_to_end_latency"

[workloads.closed_stream]
prompt_group = "short"
output_tokens = 4
streaming = true
load_mode = "closed-loop"
concurrency = 2
requests_per_trial = 6
cache_state = "cold"
primary_metric = "aggregate_output_tokens_per_second"

[diagnostics.smoke]
models = ["primary"]
workloads = ["sequential_stream"]
profilers = ["pipeline"]

[suites.smoke]
rounds = 1
trials = 1
runtime_configurations = ["serial"]
diagnostics = ["smoke"]
coverage = { primary = ["sequential_stream", "burst_nonstream", "closed_stream"] }
