schema_version = 2

[sampling]
seed = 8
temperature = 0.0
top_p = 1.0
request_timeout_seconds = 30
readiness_timeout_seconds = 30

[calibration]
max_cv_percent = 5.0

[prompts.cold]
kind = "short"
count = 2
target_tokens = 16

[prompts.shared]
kind = "shared-prefix"
count = 2
target_tokens = 16
prefix_groups = 1
suffixes_per_group = 2

[prompts.pressure]
kind = "cache-pressure"
count = 2
target_tokens = 16

[models.primary]
checkpoint = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

[runtime_configurations.serial]
backend = "v1"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "0" }

[runtime_configurations.overlap]
backend = "v1"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1" }

[workloads.cold]
prompt_group = "cold"
output_tokens = 2
streaming = false
load_mode = "sequential"
concurrency = 1
requests_per_trial = 2
cache_state = "cold"
primary_metric = "end_to_end_latency"

[workloads.shared]
prompt_group = "shared"
output_tokens = 2
streaming = false
load_mode = "burst"
concurrency = 2
requests_per_trial = 2
cache_state = "warm-prefix"
primary_metric = "end_to_end_latency"

[workloads.pressure]
prompt_group = "pressure"
output_tokens = 2
streaming = false
load_mode = "burst"
concurrency = 2
requests_per_trial = 2
cache_state = "cache-pressure"
primary_metric = "end_to_end_latency"

[suites.cache_states]
rounds = 1
trials = 1
runtime_configurations = ["serial", "overlap"]
diagnostics = []
coverage = { primary = ["cold", "shared", "pressure"] }
