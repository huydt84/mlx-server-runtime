[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-worker"
version = "0.3.0"
description = "Python MLX worker bootstrap for the local runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "mlx-vlm>=0.7.12",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
# Intentional failure boundaries (worker, scheduler, benchmark runner) that
# report errors to callers, and ValueError as the validation error contract.
ignore = ["BLE001", "TRY004"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["mlx_benchmark*", "mlx_worker*"]
