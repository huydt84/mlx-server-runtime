# MLX Air benchmark configuration.
#
# Each workload is measured on every (model, runtime configuration) pair its
# suite covers. Before measuring, every workload runs once with distinct
# warmup prompts of the same shape. Runtime configuration order alternates
# between rounds and models to cancel order bias.

schema_version = 2

[sampling]
seed = 20260715
temperature = 0.0
top_p = 1.0
request_timeout_seconds = 300
readiness_timeout_seconds = 1800

[calibration]
max_cv_percent = 5.0

[prompts.short]
kind = "short"
count = 48
target_tokens = 32

[prompts.medium]
kind = "medium"
count = 24
target_tokens = 512

[prompts.long]
kind = "long"
count = 24
target_tokens = 2048

[prompts.decode]
kind = "decode-promoting"
count = 24
target_tokens = 32

[prompts.shared_prefix]
kind = "shared-prefix"
count = 64
target_tokens = 512
prefix_groups = 8
suffixes_per_group = 8

[prompts.cache_pressure]
kind = "cache-pressure"
count = 16
target_tokens = 2048

# A local mail assistant's traffic: the client's real system prompt and
# summary, triage, and digest task prompts with synthetic emails whose bodies
# range up to the client's 2000-token cap. Prompts cycle through the three
# tasks; each task's requests share their whole system message.
[prompts.mail_assistant]
kind = "mail-assistant"
count = 48
target_tokens = 2400

# `tokenizer` defaults to `checkpoint`; `revision` defaults to the revision
# the server reports at readiness. `cold_cache_allowance_tokens` (default 0) is
# how many cached tokens a cold-cache request may reuse from a chat-template
# prefix that every request shares.
[models.primary]
checkpoint = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

# Qwen2.5's default system prompt fills one 16-token KV page.
[models.dense]
checkpoint = "mlx-community/Qwen2.5-7B-Instruct-4bit"
cold_cache_allowance_tokens = 16

[models.moe]
checkpoint = "mlx-community/LFM2.5-8B-A1B-MLX-4bit"

[models.runtime_control]
checkpoint = "mlx-community/gemma-3-270m-it-qat-8bit"

# Qwen3.5 hybrid (Gated DeltaNet + full attention) 27B checkpoints at
# sub-2-bit weights: a 1-bit affine pack and a Hadamard-rotated ternary pack.
# The checkpoint the mail assistant serves.
[models.mail]
checkpoint = "mlx-community/Qwen3-8B-4bit"

[models.hybrid_binary]
checkpoint = "prism-ml/Bonsai-27B-mlx-1bit"

[models.hybrid_ternary]
checkpoint = "prism-ml/Ternary-Bonsai-2-27B-mlx-2bit"

# Inkling-2-Mini packs (LookAtMyQuant codes): a distilled drafter exists for
# the 5.4 GB pack; the 12.8 GB pack uses the stock one.
[models.packed_small]
checkpoint = "shinmegamiboson/Inkling-2-Mini-LookAtMyQuant-5.4GB"

[models.packed_large]
checkpoint = "shinmegamiboson/Inkling-2-Mini-LookAtMyQuant-12.8GB"

# These configurations pin the KV pool and the prefix-cache entry limit so
# their results stay comparable across versions; native-mlx's own defaults size
# both from the memory planner (see mail_native). 2 GiB holds ~14.5k tokens on
# Qwen3-4B (144 KiB/token). The prefix cache counts each 16-token page as one
# entry: 256 entries (4k tokens) keep both shared_prefix_warm_c16 prefix groups
# and their suffixes, and leave ~10k tokens for in-flight requests.
[runtime_configurations.serial]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_NATIVE_EXECUTION_MODE = "serial", MLX_RUNTIME_TEXT_CACHE_BUDGET_BYTES = "2147483648", MLX_RUNTIME_TEXT_CACHE_MAX_ENTRIES = "256" }

[runtime_configurations.overlap]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_NATIVE_EXECUTION_MODE = "overlap", MLX_RUNTIME_TEXT_CACHE_BUDGET_BYTES = "2147483648", MLX_RUNTIME_TEXT_CACHE_MAX_ENTRIES = "256" }

# The v1 backend serves through mlx-lm's BatchGenerator behind the same
# gateway, so it is the mlx-lm baseline for native-mlx comparisons. Its prompt
# cache is off: native-mlx keeps no prefix cache for hybrid models, and v1 does
# not clear its cache between cold-cache trials.
[runtime_configurations.mlx_lm]
backend = "v1"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_TEXT_CACHE_BUDGET_BYTES = "0", MLX_RUNTIME_TEXT_CACHE_MAX_ENTRIES = "0" }

# The overlap scheduler without and with a drafter. The KV pool holds the
# largest mail_assistant request and still fits beside the 12.8 GB pack on a
# 24 GB host.
[runtime_configurations.packed]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_NATIVE_EXECUTION_MODE = "overlap", MLX_RUNTIME_KV_CACHE_BYTES = "805306368" }

[runtime_configurations.packed_drafter]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_NATIVE_EXECUTION_MODE = "overlap", MLX_RUNTIME_KV_CACHE_BYTES = "805306368", MLX_RUNTIME_DRAFTER = "shinmegamiboson/Inkling-2-Mini-LookAtMyQuant-drafter" }

# The v1 backend with every worker default, as `mlx-air serve --backend v1`
# runs it, including its prompt cache and serial request handling.
[runtime_configurations.mail_v1]
backend = "v1"
environment = {}

# native-mlx with its defaults, as `mlx-air serve` runs it: the overlap
# scheduler and a KV pool sized by the memory planner.
[runtime_configurations.mail_native]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1" }

# load_mode: sequential (concurrency 1), burst (all requests at once), or
# closed-loop (keep `concurrency` requests in flight).
# cache_state: cold, warm-prefix, primed, or cache-pressure. `warm-prefix` and
# `primed` both prime each shared prefix once per trial; `warm-prefix` requires
# every request to reuse part of its prompt, while `primed` records whatever
# the backend reuses, so backends with and without prefix reuse compare.
# primary_metric: ttft, tpot, end_to_end_latency, or
# aggregate_output_tokens_per_second.

[workloads.interactive_stream_c1]
prompt_group = "short"
output_tokens = 32
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 6
cache_state = "cold"
primary_metric = "ttft"

[workloads.short_nonstream_c1]
prompt_group = "short"
output_tokens = 32
streaming = false
load_mode = "sequential"
concurrency = 1
requests_per_trial = 6
cache_state = "cold"
primary_metric = "end_to_end_latency"

[workloads.cold_prefill_2k_c1]
prompt_group = "long"
output_tokens = 16
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 4
cache_state = "cold"
primary_metric = "ttft"

[workloads.decode_128_c1]
prompt_group = "decode"
output_tokens = 128
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 4
cache_state = "cold"
primary_metric = "tpot"

[workloads.steady_short_c4]
prompt_group = "short"
output_tokens = 32
streaming = true
load_mode = "closed-loop"
concurrency = 4
requests_per_trial = 16
cache_state = "cold"
primary_metric = "aggregate_output_tokens_per_second"

[workloads.steady_short_c8]
prompt_group = "short"
output_tokens = 32
streaming = true
load_mode = "closed-loop"
concurrency = 8
requests_per_trial = 32
cache_state = "cold"
primary_metric = "aggregate_output_tokens_per_second"

[workloads.mixed_c8]
prompt_group = "medium"
output_tokens = 32
streaming = true
load_mode = "closed-loop"
concurrency = 8
requests_per_trial = 32
cache_state = "cold"
primary_metric = "aggregate_output_tokens_per_second"

[workloads.shared_prefix_warm_c16]
prompt_group = "shared_prefix"
output_tokens = 32
streaming = true
load_mode = "burst"
concurrency = 16
requests_per_trial = 16
cache_state = "warm-prefix"
primary_metric = "ttft"

# Four 2k requests stay in flight (~8.3k tokens) while the 16 unique prompts
# total ~33k tokens, more than the 256-entry (4k-token) prefix cache holds, so
# the cache must evict.
[workloads.cache_pressure_c4]
prompt_group = "cache_pressure"
output_tokens = 16
streaming = false
load_mode = "closed-loop"
concurrency = 4
requests_per_trial = 16
cache_state = "cache-pressure"
primary_metric = "end_to_end_latency"

# One email at a time, as the interactive lane sends them, and two in flight,
# the client's concurrency limit. The client sends JSON tasks without
# streaming; 400 is its summary output cap. Every trial primes each task's
# system message once, as a long-running client would have sent it before.
[workloads.mail_assistant_c1]
prompt_group = "mail_assistant"
output_tokens = 400
streaming = false
load_mode = "sequential"
concurrency = 1
requests_per_trial = 6
cache_state = "primed"
primary_metric = "end_to_end_latency"

[workloads.mail_assistant_c2]
prompt_group = "mail_assistant"
output_tokens = 400
streaming = false
load_mode = "closed-loop"
concurrency = 2
requests_per_trial = 6
cache_state = "primed"
primary_metric = "end_to_end_latency"

# A focus narrows any suite to the listed models and workloads.

[focuses.gateway]
models = ["runtime_control", "primary"]
workloads = ["interactive_stream_c1", "short_nonstream_c1"]

[focuses.prefill]
models = ["primary", "dense"]
workloads = ["cold_prefill_2k_c1", "mixed_c8"]

[focuses.decode]
models = ["primary", "moe"]
workloads = ["decode_128_c1", "mixed_c8"]

[focuses.scheduler]
models = ["primary", "moe"]
workloads = ["steady_short_c4", "steady_short_c8", "mixed_c8"]

[focuses.cache]
models = ["primary", "dense"]
workloads = ["cold_prefill_2k_c1", "shared_prefix_warm_c16", "cache_pressure_c4"]

[focuses.mail_assistant]
models = ["mail"]
workloads = ["mail_assistant_c1", "mail_assistant_c2"]

# Diagnostics run after measurement in separate processes and never produce
# benchmark rows. `--profile representative` runs the first target of each
# family; `--profile all` runs every target.

[diagnostics.gateway]
models = ["runtime_control"]
workloads = ["interactive_stream_c1"]
profilers = ["pipeline"]

[diagnostics.prefill]
models = ["primary", "dense"]
workloads = ["cold_prefill_2k_c1"]
profilers = ["pipeline", "graph"]

[diagnostics.decode]
models = ["primary", "moe"]
workloads = ["decode_128_c1"]
profilers = ["graph"]

[diagnostics.scheduler]
models = ["primary"]
workloads = ["mixed_c8"]
profilers = ["pipeline"]

[diagnostics.cache]
models = ["primary"]
workloads = ["shared_prefix_warm_c16", "cache_pressure_c4"]
profilers = ["pipeline"]

# A suite lists which workloads run on which models. Each (model, runtime
# configuration) pair gets `rounds * trials` trials per workload.

[suites.smoke]
rounds = 2
trials = 1
runtime_configurations = ["serial", "overlap"]
diagnostics = []
coverage = { primary = ["interactive_stream_c1", "short_nonstream_c1", "steady_short_c4", "shared_prefix_warm_c16"] }

[suites.optimization]
rounds = 2
trials = 2
runtime_configurations = ["serial", "overlap"]
diagnostics = ["gateway", "prefill", "decode", "scheduler", "cache"]
coverage = { primary = ["interactive_stream_c1", "short_nonstream_c1", "cold_prefill_2k_c1", "decode_128_c1", "steady_short_c4", "steady_short_c8", "mixed_c8", "shared_prefix_warm_c16", "cache_pressure_c4"], dense = ["cold_prefill_2k_c1", "decode_128_c1", "mixed_c8", "shared_prefix_warm_c16", "cache_pressure_c4"], moe = ["decode_128_c1", "steady_short_c4", "steady_short_c8", "mixed_c8"], runtime_control = ["interactive_stream_c1", "short_nonstream_c1", "steady_short_c4", "steady_short_c8"] }

[suites.release]
rounds = 2
trials = 3
runtime_configurations = ["serial", "overlap"]
diagnostics = ["gateway", "prefill", "decode", "scheduler", "cache"]
coverage = { primary = ["interactive_stream_c1", "short_nonstream_c1", "cold_prefill_2k_c1", "decode_128_c1", "steady_short_c4", "steady_short_c8", "mixed_c8", "shared_prefix_warm_c16", "cache_pressure_c4"], dense = ["cold_prefill_2k_c1", "decode_128_c1", "mixed_c8", "shared_prefix_warm_c16"], moe = ["decode_128_c1", "steady_short_c4", "steady_short_c8", "mixed_c8"], runtime_control = ["interactive_stream_c1", "short_nonstream_c1", "steady_short_c4", "steady_short_c8"] }

[suites.exhaustive]
rounds = 2
trials = 4
runtime_configurations = ["serial", "overlap"]
diagnostics = ["gateway", "prefill", "decode", "scheduler", "cache"]
coverage = { primary = "all", dense = "all", moe = "all", runtime_control = "all" }

# native-mlx (overlap) against mlx-lm on the hybrid checkpoints. Hybrid models
# have no native prefix cache, so warm-prefix and cache-pressure workloads are
# not covered.
[suites.mlx_lm_comparison]
rounds = 2
trials = 2
runtime_configurations = ["overlap", "mlx_lm"]
diagnostics = []
coverage = { hybrid_binary = ["interactive_stream_c1", "cold_prefill_2k_c1", "decode_128_c1", "steady_short_c4", "mixed_c8"], hybrid_ternary = ["interactive_stream_c1", "cold_prefill_2k_c1", "decode_128_c1", "steady_short_c4", "mixed_c8"] }

# The mail assistant's workload on the backend it runs today (v1) and on
# native-mlx.
[suites.mail_assistant]
rounds = 2
trials = 2
runtime_configurations = ["mail_v1", "mail_native"]
diagnostics = []
coverage = { mail = ["mail_assistant_c1", "mail_assistant_c2"] }

# Inkling-2-Mini packs with and without the drafter. The drafter only runs
# while one request decodes alone, so steady_short_c4 covers the plain path.
# These models keep no prefix cache, so warm-prefix and cache-pressure
# workloads are not covered.
[suites.speculation]
rounds = 2
trials = 2
runtime_configurations = ["packed", "packed_drafter"]
diagnostics = []
coverage = { packed_small = ["interactive_stream_c1", "decode_128_c1", "mail_assistant_c1", "steady_short_c4"], packed_large = ["interactive_stream_c1", "decode_128_c1", "mail_assistant_c1", "steady_short_c4"] }

# Long-prompt prefill on the 5.4 GB Inkling-2-Mini pack, with streaming and
# decode rows to check that short steps keep their speed.
[suites.packed_prefill]
rounds = 2
trials = 3
runtime_configurations = ["packed"]
diagnostics = []
coverage = { packed_small = ["cold_prefill_2k_c1", "interactive_stream_c1", "decode_128_c1"] }
