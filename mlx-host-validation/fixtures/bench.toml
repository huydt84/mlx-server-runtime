# Small benchmark configuration used by mlx-host-validation/scripts/cli_bench.sh.
schema_version = 2

[sampling]
seed = 7007
temperature = 0.0
top_p = 1.0
request_timeout_seconds = 300
readiness_timeout_seconds = 1800

[calibration]
max_cv_percent = 10.0

[prompts.short]
kind = "short"
count = 8
target_tokens = 32

[prompts.shared]
kind = "shared-prefix"
count = 2
target_tokens = 128
prefix_groups = 1
suffixes_per_group = 2

[prompts.pressure]
kind = "cache-pressure"
count = 4
target_tokens = 256

[models.primary]
checkpoint = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

[models.control]
checkpoint = "mlx-community/gemma-3-270m-it-qat-8bit"

[runtime_configurations.v1]
backend = "v1"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "0" }

[runtime_configurations.native]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_NATIVE_EXECUTION_MODE = "serial" }

[runtime_configurations.block_hash]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_NATIVE_EXECUTION_MODE = "serial", MLX_RUNTIME_NATIVE_PREFIX_CACHE_STRATEGY = "block-hash", MLX_RUNTIME_TEXT_CACHE_BUDGET_BYTES = "268435456", MLX_RUNTIME_TEXT_CACHE_MAX_ENTRIES = "2" }

# A KV pool below one page fails native startup.
[runtime_configurations.broken_startup]
backend = "native-mlx"
environment = { MLX_RUNTIME_CONTINUOUS_BATCHING = "1", MLX_RUNTIME_KV_CACHE_BYTES = "1" }

[workloads.sequential_stream]
prompt_group = "short"
output_tokens = 4
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 2
cache_state = "cold"
primary_metric = "ttft"

[workloads.burst_nonstream]
prompt_group = "short"
output_tokens = 4
streaming = false
load_mode = "burst"
concurrency = 3
requests_per_trial = 3
cache_state = "cold"
primary_metric = "end_to_end_latency"

[workloads.closed_stream]
prompt_group = "short"
output_tokens = 4
streaming = true
load_mode = "closed-loop"
concurrency = 2
requests_per_trial = 6
cache_state = "cold"
primary_metric = "aggregate_output_tokens_per_second"

[workloads.cold]
prompt_group = "short"
output_tokens = 4
streaming = false
load_mode = "sequential"
concurrency = 1
requests_per_trial = 2
cache_state = "cold"
primary_metric = "end_to_end_latency"

[workloads.shared]
prompt_group = "shared"
output_tokens = 4
streaming = false
load_mode = "burst"
concurrency = 2
requests_per_trial = 2
cache_state = "warm-prefix"
primary_metric = "end_to_end_latency"

[workloads.pressure]
prompt_group = "pressure"
output_tokens = 4
streaming = false
load_mode = "burst"
concurrency = 4
requests_per_trial = 4
cache_state = "cache-pressure"
primary_metric = "end_to_end_latency"

[workloads.gateway_profile]
prompt_group = "short"
output_tokens = 2
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 1
cache_state = "cold"
primary_metric = "end_to_end_latency"

[workloads.decode_profile]
prompt_group = "short"
output_tokens = 4
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 1
cache_state = "cold"
primary_metric = "tpot"

[workloads.delayed_ttft]
prompt_group = "short"
output_tokens = 2
streaming = true
load_mode = "sequential"
concurrency = 1
requests_per_trial = 2
cache_state = "cold"
primary_metric = "ttft"

[diagnostics.gateway]
models = ["control"]
workloads = ["gateway_profile"]
profilers = ["pipeline"]

[diagnostics.decode]
models = ["control"]
workloads = ["decode_profile"]
profilers = ["graph"]

[suites.load_modes]
rounds = 1
trials = 1
runtime_configurations = ["v1"]
diagnostics = []
coverage = { primary = ["sequential_stream", "burst_nonstream", "closed_stream"] }

[suites.cache_states]
rounds = 1
trials = 1
runtime_configurations = ["block_hash"]
diagnostics = []
coverage = { primary = ["cold", "shared", "pressure"] }

[suites.diagnostics]
rounds = 1
trials = 1
runtime_configurations = ["native"]
diagnostics = ["gateway", "decode"]
coverage = { control = ["gateway_profile", "decode_profile"] }

[suites.statistics]
rounds = 1
trials = 2
runtime_configurations = ["native"]
diagnostics = []
coverage = { control = ["delayed_ttft"] }

[suites.fail_startup]
rounds = 1
trials = 1
runtime_configurations = ["broken_startup"]
diagnostics = []
coverage = { primary = ["cold"] }

[suites.fail_trial]
rounds = 1
trials = 1
runtime_configurations = ["v1"]
diagnostics = []
coverage = { control = ["cold", "burst_nonstream"] }
